# Infrastructure for "production" mode. The API itself runs on the host,
# next to LM Studio.
#
#   docker compose up -d qdrant          # then QDRANT_MODE=server in .env
#   docker compose up -d neo4j           # then GRAPH_BACKEND=neo4j in .env
#
# Neo4j browser: http://localhost:7474  (neo4j / password123)
# Qdrant dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      # LangChain's Neo4jGraph reads the schema with apoc.meta.data(),
      # so the APOC plugin is REQUIRED, not optional.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
